<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Agentic AI Content Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f5f8; --surface: #ffffff; --surface-2: #eef0f5;
    --border: #dfe2ea; --border-strong: #c7cbd8;
    --text: #191c26; --text-2: #565c70; --text-3: #83889c;
    --accent: #3d3fd6; --accent-ink: #ffffff;
    --accent-soft: #edeeff; --accent-soft-border: #d6d8ff;
    --doc: #2563eb; --doc-soft: #e8effe;
    --slides: #b3610a; --slides-soft: #fbeddc;
    --code: #0e8f7e; --code-soft: #e2f6f2;
    --danger: #c0362c; --danger-soft: #fbe9e7; --danger-soft-border: #f3c6c0;
    --shadow: 0 1px 2px rgba(20,22,34,.04), 0 8px 24px -12px rgba(20,22,34,.12);
    --radius: 14px; --radius-sm: 9px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14151c; --surface: #1b1d27; --surface-2: #22242f;
      --border: #2d303e; --border-strong: #3c3f52;
      --text: #edeef4; --text-2: #a7abc0; --text-3: #767b93;
      --accent: #8789ff; --accent-ink: #14151c;
      --accent-soft: #24243f; --accent-soft-border: #37387a;
      --doc: #6fa2ff; --doc-soft: #1c2740;
      --slides: #eab155; --slides-soft: #372a17;
      --code: #4fd0bb; --code-soft: #14332f;
      --danger: #ff8b80; --danger-soft: #3a1f1c; --danger-soft-border: #6b332c;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14151c; --surface: #1b1d27; --surface-2: #22242f;
    --border: #2d303e; --border-strong: #3c3f52;
    --text: #edeef4; --text-2: #a7abc0; --text-3: #767b93;
    --accent: #8789ff; --accent-ink: #14151c;
    --accent-soft: #24243f; --accent-soft-border: #37387a;
    --doc: #6fa2ff; --doc-soft: #1c2740;
    --slides: #eab155; --slides-soft: #372a17;
    --code: #4fd0bb; --code-soft: #14332f;
    --danger: #ff8b80; --danger-soft: #3a1f1c; --danger-soft-border: #6b332c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -12px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  ::selection { background: var(--accent-soft-border); }
  a { color: inherit; }
  button, input, select { font-family: inherit; }
  .shell { max-width: 1180px; margin: 0 auto; padding: 28px 24px 64px; }
  header.top { display: flex; flex-direction: column; gap: 6px; margin-bottom: 22px; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
  h1 { font-family: "Sora", sans-serif; font-weight: 700; font-size: clamp(24px,3.4vw,32px); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
  .lede { color: var(--text-2); max-width: 62ch; font-size: 14.5px; margin: 2px 0 0; }
  .howto { margin-top: 14px; background: var(--accent-soft); border: 1px solid var(--accent-soft-border); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13.5px; color: var(--text-2); display: flex; gap: 10px; align-items: flex-start; }
  .howto svg { flex-shrink: 0; margin-top: 2px; color: var(--accent); }
  .howto strong { color: var(--text); font-weight: 600; }
  .search-row { margin-top: 18px; display: flex; gap: 10px; align-items: center; }
  .search-box { position: relative; flex: 1; max-width: 380px; }
  .search-box input { width: 100%; padding: 9px 12px 9px 34px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 13.5px; outline: none; }
  .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-box svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
  .result-count { font-size: 12.5px; color: var(--text-3); font-family: "IBM Plex Mono", monospace; }
  .layout { margin-top: 22px; display: grid; grid-template-columns: 220px minmax(0,1fr); gap: 22px; align-items: start; }
  nav.weeks { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 3px; max-height: calc(100vh - 40px); overflow-y: auto; padding-right: 4px; }
  .week-btn { display: flex; align-items: baseline; gap: 9px; text-align: left; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--text-2); width: 100%; }
  .week-btn:hover { background: var(--surface-2); color: var(--text); }
  .week-btn.active { background: var(--surface); border-color: var(--border); color: var(--text); box-shadow: var(--shadow); }
  .week-btn .num { font-family: "Sora", sans-serif; font-weight: 700; font-size: 13px; color: var(--text-3); min-width: 20px; }
  .week-btn.active .num { color: var(--accent); }
  .week-btn .label { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .phase-btn { display: flex; align-items: center; gap: 9px; text-align: left; padding: 8px 10px; margin: 2px 0; border-radius: var(--radius-sm); border: 1px dashed var(--accent-soft-border); background: var(--accent-soft); cursor: pointer; color: var(--accent); width: 100%; }
  .phase-btn:hover { border-style: solid; }
  .phase-btn.active { border-style: solid; background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); }
  .phase-btn .label { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main.panel { min-width: 0; }
  .week-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .week-head h2 { font-family: "Sora", sans-serif; font-size: 19px; font-weight: 700; margin: 0; }
  .week-head .count { font-size: 12.5px; color: var(--text-3); font-family: "IBM Plex Mono", monospace; }
  .session-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .session-tab { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2); font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 7px; }
  .session-tab .n { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-3); }
  .session-tab.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .session-tab.active .n { color: var(--accent-ink); opacity: .75; }
  .session-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px 22px; }
  .session-card .title-row { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 4px; }
  .session-card h3 { font-family: "Sora", sans-serif; font-size: 20px; font-weight: 700; margin: 0; text-wrap: balance; }
  .session-meta { color: var(--text-3); font-size: 12.5px; font-family: "IBM Plex Mono", monospace; margin-bottom: 18px; }
  .resources { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
  .resources.cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .res-card { min-width: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .res-top { display: flex; align-items: center; gap: 8px; }
  .res-icon { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .res-icon.doc { background: var(--doc-soft); color: var(--doc); }
  .res-icon.slides { background: var(--slides-soft); color: var(--slides); }
  .res-icon.code { background: var(--code-soft); color: var(--code); }
  .res-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
  .res-title { font-size: 13.5px; font-weight: 500; color: var(--text); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .res-preview { min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; display: flex; align-items: center; gap: 6px; overflow: hidden; }
  .res-preview .url { min-width: 0; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .res-preview .domain-badge { font-size: 10px; font-family: "IBM Plex Mono", monospace; padding: 2px 6px; border-radius: 5px; background: var(--surface-2); color: var(--text-3); flex-shrink: 0; }
  .res-actions { display: flex; gap: 6px; margin-top: 2px; }
  .btn-open, .btn-primary { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 10px; border-radius: 7px; border: none; background: var(--accent); color: var(--accent-ink); font-size: 12.5px; font-weight: 600; cursor: pointer; text-decoration: none; }
  .btn-open:hover, .btn-primary:hover { filter: brightness(1.06); }
  .btn-copy, .btn-secondary { display: flex; align-items: center; justify-content: center; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2); cursor: pointer; padding: 8px 12px; font-size: 12.5px; font-weight: 600; gap: 6px; }
  .btn-copy { width: 34px; padding: 0; }
  .btn-copy:hover, .btn-secondary:hover { color: var(--text); border-color: var(--text-3); }
  .btn-copy.copied { color: var(--code); border-color: var(--code); }
  .btn-danger { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger-soft-border); border-radius: 7px; padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn-danger:hover { filter: brightness(0.97); }
  footer.foot { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--text-3); }
  .empty-state { padding: 40px 20px; text-align: center; color: var(--text-3); font-size: 13.5px; }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    nav.weeks { position: static; flex-direction: row; overflow-x: auto; max-height: none; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .week-btn { flex-direction: column; gap: 2px; align-items: flex-start; flex-shrink: 0; width: auto; }
    .phase-btn { width: auto; flex-shrink: 0; margin: 0; }
    .resources { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* auth + admin */
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 26px; }
  .auth-card h1 { font-size: 21px; margin: 10px 0 4px; }
  .auth-card p.sub { color: var(--text-2); font-size: 13.5px; margin: 0 0 20px; }
  .field-label { font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; display: block; }
  .text-input { width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 14px; outline: none; }
  .text-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .auth-error { margin-top: 12px; font-size: 13px; color: var(--danger); background: var(--danger-soft); border: 1px solid var(--danger-soft-border); border-radius: 8px; padding: 9px 11px; }
  .auth-submit { margin-top: 16px; width: 100%; }

  .userbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); background: var(--surface-2); border: 1px solid var(--border); padding: 6px 11px; border-radius: 999px; }
  .chip.role-admin { background: var(--accent-soft); border-color: var(--accent-soft-border); color: var(--accent); font-weight: 600; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(10,10,16,.5); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow-y: auto; }
  .modal { width: 100%; max-width: 820px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .modal-head h2 { font-family: "Sora", sans-serif; font-size: 18px; margin: 0; }
  .modal-body { padding: 22px; display: flex; flex-direction: column; gap: 26px; }
  .modal-close { border: none; background: var(--surface-2); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; color: var(--text-2); display: flex; align-items: center; justify-content: center; }
  .admin-section h3 { font-family: "Sora", sans-serif; font-size: 14.5px; margin: 0 0 10px; }
  .admin-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .admin-row input[type="email"] { flex: 1; min-width: 180px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 13.5px; }
  .admin-row select { padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 13.5px; }
  .file-drop { border: 1px dashed var(--border-strong); border-radius: 9px; padding: 12px; font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.data-table th { text-align: left; padding: 7px 8px; color: var(--text-3); font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.data-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); color: var(--text-2); }
  table.data-table td.mono, .mono { font-family: "IBM Plex Mono", monospace; }
  .table-scroll { max-height: 320px; overflow: auto; border: 1px solid var(--border); border-radius: 9px; }
  .table-scroll table { margin: 0; }
  .table-scroll thead th { position: sticky; top: 0; background: var(--surface); }
  .admin-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .admin-search { padding: 7px 10px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 12.5px; min-width: 180px; }
  .pill-role { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
  .pill-role.admin { background: var(--accent-soft); color: var(--accent); }
  .pill-role.instructor { background: var(--surface-2); color: var(--text-2); }
  .pill-action { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 6px; }
  .pill-action.login { background: var(--code-soft); color: var(--code); }
  .pill-action.login_failed { background: var(--danger-soft); color: var(--danger); }
  .pill-action.open_resource { background: var(--doc-soft); color: var(--doc); }
  .pill-action.copy_link { background: var(--slides-soft); color: var(--slides); }
  .pill-action.default { background: var(--surface-2); color: var(--text-2); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow); z-index: 100; }
  .sync-note { font-size: 11.5px; color: var(--text-3); }
</style>
</head>
<body>
<div id="root"></div>
<script src="/app.js"></script>
</body>
</html>
